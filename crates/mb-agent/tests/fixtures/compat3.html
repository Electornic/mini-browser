<!doctype html>
<html>
<head>
<title>Acme Tools</title>
<!--
  Compat round 3 tracker (docs/compat-round3.md, common rules "손으로 쓴 3차
  골든 + eval"). Hand-written; patterns only, no real-site content.

  compat3.observation.txt records TODAY's rendering ON PURPOSE, wrong parts
  included. Each round-3 step should move it in a known direction; review
  the golden diff against this list (what Chrome shows at 800px):

  1. "Skip to content" — sr-only (1px, overflow:hidden, clip): listed as a
     link, but its text paints nowhere. Matches Chrome since step 3a (the
     clip table hides the box's text; still observed — a11y inclusion).
  2. Search form (.hide-sm) — visible at 800px: its `display:none
     !important` sits in a max-width:600px @media. Matches Chrome: step 1a
     keeps !important and step 2.1 (@media evaluation) keeps that block off
     at 800px (before 2.1 it showed only because !important was dropped).
  3. Mobile @media — desktop nav (Features, Pricing) visible, "Open
     navigation" hidden. Matches Chrome since step 2.1 (@media evaluated);
     before it every @media applied and the two were inverted.
  4. Checkbox-hack menu — "Menu" label toggles the hidden checkbox and
     `:checked ~ .menu` opens the list (Docs, Contact). Matches Chrome
     since step 4b (`:checked` parsed and matched; before it the rule
     was dropped whole and the menu never opened). The golden shows it
     collapsed, as on load; mb-agent `compat3_menu_opens_through_its_label_and_leads_to_docs`
     pins the click.
  5. Carousel — 300px window with overflow:hidden: only slide one is
     visible; slides two and three are clipped out. Since step 3a they
     are (painted nowhere, no longer extend page_height — 475 → 318), but
     still observed with their links (a11y inclusion; clicking them is
     step 3b's "clipped out of view" error). Our slides stack vertically
     (nowrap inline-blocks wrap — a layout gap), Chrome lays them in a row.

  eval/scenarios/compat3-menu.json drives item 4 ("open the menu, go to
  Docs"); it failed before step 4b by design; since 4b the path works
  (the mb-agent test above runs it without an LLM).
-->
<style>
  body { margin: 0; font-size: 16px; }
  header { padding: 8px; }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .mobile-toggle { display: none; }
  @media (max-width: 600px) {
    .desktop-nav { display: none; }
    .mobile-toggle { display: block; }
    .hide-sm { display: none !important; }
  }
  .menu-box { position: absolute; left: -9999px; }
  .menu { display: none; }
  .menu-box:checked ~ .menu { display: block; }
  .carousel { width: 300px; height: 100px; overflow: hidden; white-space: nowrap; }
  .slide { display: inline-block; width: 300px; height: 100px; }
</style>
</head>
<body>
<a class="sr-only" href="#main">Skip to content</a>
<header>
  <nav class="desktop-nav"><a href="#features">Features</a> <a href="#pricing">Pricing</a></nav>
  <button class="mobile-toggle">Open navigation</button>
  <form class="hide-sm" action="#search"><input type="search" name="q" aria-label="Search docs"> <button>Search</button></form>
  <div class="main-menu">
    <input type="checkbox" id="menu" class="menu-box">
    <label for="menu">Menu</label>
    <ul class="menu">
      <li><a href="compat3-docs.html">Docs</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </div>
</header>
<main id="main">
  <h1>Acme Tools</h1>
  <p>Build, ship and watch your services from one place.</p>
  <div class="carousel"><div class="slide">Slide one: fast builds</div><div class="slide">Slide two: <a href="#safe">safe deploys</a></div><div class="slide">Slide three: <a href="#teams">happy teams</a></div></div>
  <p id="contact">Questions? Write to the team.</p>
</main>
</body>
</html>
