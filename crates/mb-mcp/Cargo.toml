[package]
name = "mb-mcp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mb-mcp"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
mb-agent = { path = "../mb-agent" }
mb-runtime = { path = "../mb-runtime" }
mb-shell = { path = "../mb-shell" }
mb-engine = { path = "../mb-engine" }
rmcp = { version = "3", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
