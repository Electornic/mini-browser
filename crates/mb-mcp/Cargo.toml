[package]
name = "mb-mcp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mb-mcp"
path = "src/main.rs"

[dependencies]
arboard = { version = "3", default-features = false }
base64 = "0.22"
bytes = "1"
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
image = { version = "0.25", default-features = false, features = ["png"] }
mb-agent = { path = "../mb-agent" }
mb-runtime = { path = "../mb-runtime" }
mb-shell = { path = "../mb-shell" }
mb-engine = { path = "../mb-engine" }
rmcp = { version = "3", features = ["server", "macros", "transport-io", "schemars", "transport-streamable-http-server"] }
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "net"] }
