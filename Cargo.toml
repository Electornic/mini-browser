[workspace]
members = [
    "crates/mb-dom",
    "crates/mb-engine",
    "crates/mb-runtime",
    "crates/mb-shell",
]

[package]
name = "mini-browser"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
cosmic-text = "0.19"
cssparser = "0.36"
html5ever = "0.38"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png"] }
markup5ever_rcdom = "0.38"
precomputed-hash = "0.1"
rquickjs = { version = "0.11", features = ["macro"] }
selectors = "0.37"
softbuffer = "0.4"
taffy = "0.10"
thiserror = "2"
tiny-skia = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
ureq = "3"
url = "2"
winit = "0.30"
